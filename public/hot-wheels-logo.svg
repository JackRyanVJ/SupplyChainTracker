<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160">
  <defs>
    <linearGradient id="hwFlameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF000" />
      <stop offset="25%" stop-color="#FF7A00" />
      <stop offset="60%" stop-color="#E50000" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
    <linearGradient id="hwGoldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFF500" />
      <stop offset="100%" stop-color="#FF8A00" />
    </linearGradient>
    <filter id="hwGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Dynamic Racing Flame Ribbon -->
  <path d="M 15 115 
           C 40 85, 70 95, 95 65 
           C 115 40, 150 20, 205 25 
           C 255 30, 290 10, 355 15 
           C 415 20, 470 50, 485 75 
           C 460 70, 435 72, 415 85 
           C 450 90, 475 110, 465 130 
           C 420 120, 380 135, 340 142 
           C 275 152, 220 138, 175 145 
           C 120 152, 70 148, 15 115 Z" 
        fill="url(#hwFlameGrad)" 
        stroke="#FFFFFF" 
        stroke-width="3" 
        filter="url(#hwGlow)" />

  <!-- Inner Speed Flare -->
  <path d="M 45 105 
           C 85 75, 140 45, 230 40 
           C 310 35, 410 45, 450 78 
           C 390 80, 330 72, 270 90 
           C 200 110, 120 125, 45 105 Z" 
        fill="#FFE600" 
        opacity="0.35" />

  <!-- HOT WHEELS Italicized Racing Typography -->
  <g transform="skewX(-14) translate(30, 0)">
    <!-- HOT -->
    <text x="50" y="96" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="62" 
          font-style="italic"
          letter-spacing="-1px"
          fill="#FFFFFF" 
          stroke="#7A0000" 
          stroke-width="6" 
          paint-order="stroke fill">
      HOT
    </text>
    <text x="50" y="96" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="62" 
          font-style="italic"
          letter-spacing="-1px"
          fill="url(#hwGoldText)">
      HOT
    </text>

    <!-- WHEELS -->
    <text x="180" y="104" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="68" 
          font-style="italic"
          letter-spacing="-2px"
          fill="#FFFFFF" 
          stroke="#7A0000" 
          stroke-width="7" 
          paint-order="stroke fill">
      WHEELS
    </text>
    <text x="180" y="104" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="68" 
          font-style="italic"
          letter-spacing="-2px"
          fill="url(#hwGoldText)">
      WHEELS
    </text>
  </g>
</svg>
